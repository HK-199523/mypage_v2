upstream react {
    server web-front:3000;
}

upstream django {
    server nginx_back:80;
}

server {
    listen 80;
    server_name chacondog.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name chacondog.com;

    ssl_certificate /etc/letsencrypt/live/chacondog.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chacondog.com/privkey.pem;

    location = /healthz {
        return 200;
    }

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    location /media/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://react;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    location /_next/webpack-hmr {
        proxy_pass http://react/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}